# The bibliography, in one place, numbered once.
#
# WHY THIS FILE EXISTS. The reference list used to live inside science.qmd,
# which meant a source cited on three pages was numbered on one of them and
# spelled out in prose on the other two. Numbers only mean something if they
# mean the same thing everywhere, so the list moved here and every page links
# into the single page generated from it.
#
# ORDER IS THE CONTRACT. An entry's position is its citation number and pages
# refer to it by that number, so entries are APPENDED, never inserted or
# reordered. docs/build_references.py checks that every number a page cites
# exists here.

