    entries:
      - n: 65
        text: "Shireby GL, Davies JP, Francis PT et al. Recalibrating the epigenetic clock: implications for assessing biological age in the human cortex. *Brain* 143(12):3763-3775 (2020). Supplementary Table 3 carries the 347 weights the cortical clock uses here."
        doi: "10.1093/brain/awaa334"
      - n: 66
        text: "McCartney DL, Hillary RF, Stevenson AJ et al. Epigenetic prediction of complex traits and death. *Genome Biology* 19:136 (2018). Additional file 1 carries the ten EpiScore weight sets."
        doi: "10.1186/s13059-018-1514-1"
      - n: 67
        text: "Horvath S. Putting epigenetic aging clocks on trial. *Nature Medicine* (2026). Asks whether a methylation clock behaves as a surrogate endpoint should, which is the question a score has to survive before it is used to judge an intervention."
        doi: "10.1038/s41591-026-04524-1"
