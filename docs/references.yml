        text: "Tong H, Dwaraka VB, Chen Q et al. Quantifying the stochastic component of epigenetic aging. *Nature Aging* 4(6):886-901 (2024). Across 22,770 blood samples from 25 cohorts, 66 to 75 per cent of Horvath's accuracy is reproducible by drift alone, rising to about 90 per cent for Zhang and falling to about 63 per cent for PhenoAge."
        doi: "10.1038/s43587-024-00600-8"
