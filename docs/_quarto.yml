quartodoc:
  package: falconage
  dir: reference
  title: Python reference
  style: pkgdown
  render_interlinks: false
  sections:
  - title: Reading data
    desc: Every reader returns the same container, so nothing downstream can tell which format
      the data arrived in.
    contents:
    - read
    - read_betas
    - read_series_matrix
    - read_clinical
    - read_rrbs_dir
    - read_bedmethyl
    - read_bedmethyl_dir
    - read_panel
    - read_computage_bench
    - list_computage_bench
    - preprocess.read_olink
    - preprocess.read_somascan
    - preprocess.read_counts
    - FalconData
  - title: Raw arrays
    desc: IDAT to scoreable betas, which at first meant leaving FALCONAge for sesame or minfi
      and coming back. The manifest is fetched from Illumina's public bucket and cached; it
      is the one step here that is not offline. Detection is computed before background correction,
      because pOOBAH's null is the uncorrected out-of-band signal.
    contents:
    - idat_to_betas
    - read_idat_dir
    - preprocess.poobah
    - preprocess.noob
    - preprocess.dye_bias
    - preprocess.bmiq
    - preprocess.RawSignal
    - preprocess.load_manifest
    - preprocess.manifest_record
    - preprocess.load_mask
    - preprocess.mask_report
    - preprocess.apply_mask
  - title: Preprocessing
    desc: 'Getting a matrix into the shape every clock assumes: bare probe identifiers, values
      in the beta range, a known platform. The EPIC v2 step is mandatory rather than optional
      -- without it a v2 dataset overlaps almost nothing and the clocks score imputed values.'
    contents:
    - prepare
    - prepare_clinical
    - qc
    - probe_loss
    - preprocess.aggregate_replicate_probes
    - preprocess.impute
    - fit_batch_reference
    - apply_batch_reference
    - preprocess.BatchReference
    - preprocess.prepare_proteomic
    - preprocess.prepare_transcriptomic
    - preprocess.rle_normalise
    - preprocess.yugene
    - preprocess.median_centre
  - title: Uncertainty
    desc: 'How much of a score is the assay, and how far it is likely to be from the truth.
      Two different questions with two different answers, kept apart on purpose: technical
      replicates of the same DNA differ by up to nine years on prominent clocks, and a point
      estimate says nothing about either.'
    contents:
    - technical_se
    - interval
    - conformal_interval
    - icc_from_replicates
    - uncertainty.load_probe_icc
    - uncertainty.probe_icc_source
    - uncertainty.load_conformal
  - title: Study design
    desc: The commands that come before the first array and after the last one. How many samples
      an effect needs, given the clock's own reliability; and whether a difference that turned
      up survives the multi-clock rule that a re-analysis of six intervention datasets says
      it must.
    contents:
    - power
    - detectable_effect
    - consensus
    - registry.evidence
  - title: Scoring
    desc: The predict loop, its result object, and the provenance it carries.
    contents:
    - score
    - combine
    - FalconResult
  - title: The clock catalogue
    desc: 161 clocks in three availability tiers. Twenty-eight are scaffolds whose coefficients
      are research-use-only; the registry says which, why, and what open clock answers the
      same question.
    contents:
    - registry.load
    - registry.ClockRegistry
    - registry.Clock
    - registry.register_local_weights
  - title: Analysis
    desc: Age acceleration in its three conventions, association and survival models, reliability,
      and the AA1/AA2 benchmark. Each is gated on the clock's scale type -- acceleration on
      a pace-of-aging clock is a units error, not a conservative choice.
    contents:
    - acceleration
    - cell_composition
    - associate
    - cox_hazard
    - agreement
    - icc
    - run_benchmark
  - title: Clinical references
    desc: 'KDM and homeostatic dysregulation have no fixed coefficients: both are defined
      relative to a reference cohort, and the manifest records which.'
    contents:
    - models.fit_kdm
    - models.fit_hd
    - models.clinical.phenoage
  - title: Model architectures
    desc: Not every clock is a dot product. Six summarise a probe set with a mean or a percentile;
      the principal-component and neural families need a weight file no licence permits redistributing;
      scAge asks a different question entirely, one age per cell from a methylome that is
      99% missing. All of these are implemented and tested against synthetic weights, and
      all of them work the day a user supplies a file.
    contents:
    - models.AggregationClock
    - models.NeuralClock
    - models.read_neural_weights
    - models.PCLinearClock
    - models.read_rotation
    - models.ScAgeReference
    - models.fit_scage_reference
    - models.scage
  - title: Figures and reports
    desc: 'Every plot returns its data as well as its figure, which is how the two languages
      draw the same numbers with different engines. `clock_atlas` is the exception in scale
      rather than in kind: one figure covering every clock across every pooled study, for
      the case where a per-clock panel would need forty of them.'
    contents:
    - plot.ba_vs_ca
    - plot.bland_altman
    - plot.calibration
    - plot.acceleration_density
    - plot.acceleration_by_group
    - plot.acceleration_heatmap
    - plot.forest
    - plot.kaplan_meier
    - plot.volcano
    - plot.clock_corr
    - plot.clock_radar
    - plot.clock_chord
    - plot.clock_pca
    - plot.clock_atlas
    - plot.coverage_bar
    - plot.missingness
    - plot.beta_density
    - plot.platform_comparison
    - plot.study_comparison
    - plot.benchmark_bars
    - plot.benchmark_error_bias
    - plot.benchmark_heatmap
    - plot.reliability_forest
    - plot.score_interval
    - plot.platform_bias
    - plot.consensus_plot
    - plot.palette
    - plot.save_all
    - report.write_report
    - report.run_report
    - report.write_quarto_report
  - title: Downloading public data
    desc: Accession in, files and a normalised sample table out. Credentialed archives are
      documented rather than automated -- the access agreement is the user's, not the tool's.
    contents:
    - download
    - download.cache_info
    - download.clear_cache
  - title: Configuration and setup
    desc: What resolved, on this machine, in this environment.
    contents:
    - config
    - configure
    - core.resolve
    - core.describe
    - FalconConfig
    - RunManifest
