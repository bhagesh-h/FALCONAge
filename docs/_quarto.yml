quartodoc:
  package: falconage
  dir: reference
  title: Python reference
  style: pkgdown
  render_interlinks: false
  sections:
  - title: Start here
    desc: 'The functions a first analysis uses, in the order it uses them: read the data,
      prepare it, score it, and ask how far each number can be trusted. Everything else on
      this page builds on these.'
    contents:
    - read
    - read_betas
    - prepare
    - score
    - FalconResult
    - technical_se
    - conformal_interval
    - acceleration
    - consensus
    - report.run_report
    - demo_data
  - title: Reading data
    desc: 'Input is data that is already normalised and quality controlled: a beta matrix,
      a GEO series matrix, a clinical chemistry table or a Nightingale NMR table. Every reader
      returns the same container.'
    contents:
    - read_series_matrix
    - read_clinical
    - read_nightingale
    - read_panel
    - read_computage_bench
    - list_computage_bench
    - FalconData
  - title: Preparing data
    desc: 'The light steps scoring needs on an input matrix: bare probe identifiers, EPIC
      v2 replicate probes collapsed, values in the beta range, a known platform, clinical
      units converted. No normalisation or probe filtering; that belongs upstream. The EPIC
      v2 step is not optional: without it a v2 dataset overlaps almost nothing and the clocks
      score imputed values.'
    contents:
    - prepare_clinical
    - qc
    - probe_loss
    - preprocess.aggregate_replicate_probes
    - preprocess.platform_probes
    - preprocess.impute
    - preprocess.horvath_normalise
  - title: Uncertainty
    desc: 'How much of a score is the assay, and how far it is likely to be from the truth.
      Two different questions with two different answers, kept apart on purpose: technical
      replicates of the same DNA differ by up to nine years on prominent clocks, and a point
      estimate says nothing about either.'
    contents:
    - interval
    - icc_from_replicates
    - uncertainty.load_probe_icc
    - uncertainty.probe_icc_source
    - uncertainty.load_conformal
  - title: Study design
    desc: The commands that come before the first array and after the last one. How many samples
      an effect needs, given the clock's own reliability; and whether a difference that turned
      up survives the multi-clock rule that a re-analysis of six intervention datasets says
      it must.
    contents:
    - power
    - detectable_effect
    - registry.evidence
  - title: Scoring
    desc: The predict loop, its result object, and the provenance it carries.
    contents:
    - combine
  - title: The clock catalogue
    desc: '178 clocks in three availability groups: 69 bundled, 52 untraced and 57 licensed
      scaffolds whose coefficients are research-use-only or have no public source FALCONAge
      may redistribute. The registry says which, why, and which bundled clocks answer the
      same question.'
    contents:
    - registry.load
    - registry.ClockRegistry
    - registry.Clock
    - registry.register_local_weights
  - title: Analysis
    desc: Age acceleration in its three conventions, association and survival models, reliability,
      and the AA1/AA2 benchmark. Each is gated on the clock's scale type -- acceleration on
      a pace-of-aging clock is a units error, not a conservative choice.
    contents:
    - cell_composition
    - associate
    - cox_hazard
    - agreement
    - icc
    - run_benchmark
    - leave_one_marker_out
  - title: Your own clocks
    desc: Compare learners on your own cohort, fit the one you choose, combine several clocks
      into one score, and add any of them to the catalogue for a session so it is scored like
      a published clock. Every reported number is out of fold.
    contents:
    - compare_learners
    - fit_clock
    - stack_clocks
    - add_clock
  - title: Clinical references
    desc: 'KDM and homeostatic dysregulation have no fixed coefficients: both are defined
      relative to a reference cohort, and the manifest records which.'
    contents:
    - models.fit_kdm
    - models.fit_hd
    - models.clinical.phenoage
    - blood_count_ratios
  - title: Model architectures
    desc: Not every clock is a dot product. The mitotic clocks summarise a probe set with
      a mean or a percentile; AltumAge is a dense network read from a safetensors file; scAge
      asks a different question entirely, one age per cell from a methylome that is 99% missing.
    contents:
    - models.AggregationClock
    - models.NeuralClock
    - models.read_neural_weights
    - models.ScAgeReference
    - models.fit_scage_reference
    - models.scage
  - title: Figures and reports
    desc: 'Every plot returns its data as well as its figure, which is how the two languages
      draw the same numbers with different engines. Figures carry axes and legend only; `save_figure`
      writes each as `<title>.png` with its title, numbers and description in `<title>.txt`.
      `clock_atlas` is the exception in scale rather than in kind: one figure covering every
      clock across every pooled study, for the case where a per-clock panel would need forty
      of them.'
    contents:
    - plot.clock_coverage_manhattan
    - plot.clock_coverage_points
    - plot.ba_vs_ca
    - plot.bland_altman
    - plot.calibration
    - plot.acceleration_density
    - plot.acceleration_by_group
    - plot.acceleration_heatmap
    - plot.forest
    - plot.kaplan_meier
    - plot.volcano
    - plot.clock_corr
    - plot.clock_radar
    - plot.clock_chord
    - plot.clock_pca
    - plot.clock_atlas
    - plot.coverage_bar
    - plot.missingness
    - plot.beta_density
    - plot.platform_comparison
    - plot.study_comparison
    - plot.benchmark_bars
    - plot.benchmark_error_bias
    - plot.benchmark_heatmap
    - plot.reliability_forest
    - plot.score_interval
    - plot.platform_bias
    - plot.consensus_plot
    - plot.palette
    - plot.save_all
    - plot.save_figure
    - plot.figure_text
    - plot.read_caption
    - report.write_report
    - report.write_quarto_report
  - title: Downloading public data
    desc: Accession in, files and a normalised sample table out. Credentialed archives are
      documented rather than automated -- the access agreement is the user's, not the tool's.
    contents:
    - download
    - download.cache_info
    - download.clear_cache
  - title: Configuration and setup
    desc: What resolved, on this machine, in this environment.
    contents:
    - config
    - configure
    - core.resolve
    - core.describe
    - FalconConfig
    - RunManifest
