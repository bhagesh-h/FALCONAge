# =============================================================================
# One source of truth for the documentation's shape
# =============================================================================
#
# Both reference trees are generated: quartodoc reads the Python docstrings,
# pkgdown reads the roxygen blocks. Neither needs hand-writing. What DOES need
# keeping in step is the grouping -- which functions sit under which heading --
# because that is what a reader navigates by, and two YAML files maintained
# separately drift within a release.
#
# So the grouping lives here, once, and build_docs.py emits both
# docs/_quarto.yml and r/_pkgdown.yml from it. Editing either generated file by
# hand is a mistake the next build silently reverts.
#
# Each group names its Python and R members separately, because the two APIs
# are one-to-one in intent but not in spelling: Python has `fa.score(...)` and
# `FalconResult.long()`, R has `score()` and `as.data.frame(form = "long")`.
# Forcing identical names would make one language read like a translation of
# the other, which is exactly what the reticulate bridge exists to avoid.
# -----------------------------------------------------------------------------

site:
  title: FALCONAge
  # One description, used everywhere: the HTML meta tag, the sidebar blurb, the
  # pkgdown home page and the subtitle of the combined PDF. The landing page
  # deliberately does NOT repeat it -- the sidebar is on that page too, and the
  # same sentence twice above the fold reads as a templating mistake.
  description: >-
    Biological age and aging-clock scoring from multiomic data, in Python and R.
  url: https://bhagesh-h.github.io/FALCONAge/
  repo: https://github.com/bhagesh-h/FALCONAge

groups:
  - title: Start here
    desc: >-
      The functions a first analysis uses, in the order it uses them: read the
      data, prepare it, score it, and ask how far each number can be trusted.
      Everything else on this page builds on these.
    python: [read, read_betas, prepare, score, FalconResult, technical_se,
             conformal_interval, acceleration, consensus, report.run_report,
             demo_data]
    r: [read_betas, prepare, score, as.data.frame.falcon_result, interpretation,
        technical_se, conformal_interval, acceleration, consensus, run_report]

  - title: Reading data
    desc: >-
      Every reader returns the same container, so nothing downstream can tell
      which format the data arrived in.
    python: [read_series_matrix, read_clinical, read_rrbs_dir, read_bedmethyl,
             read_bedmethyl_dir, read_panel, read_computage_bench,
             list_computage_bench, preprocess.read_olink, preprocess.read_somascan,
             preprocess.read_counts, read_nightingale, FalconData]
    r: [read_series_matrix, read_clinical, read_rrbs_dir, falcon_data, obs, write_h5ad]

  - title: Raw arrays
    desc: >-
      IDAT to scoreable betas, which at first meant leaving FALCONAge for
      sesame or minfi and coming back. The manifest is fetched from Illumina's
      public bucket and cached; it is the one step here that is not offline.
      Detection is computed before background correction, because pOOBAH's null
      is the uncorrected out-of-band signal.
    python: [idat_to_betas, read_idat_dir, preprocess.poobah, preprocess.noob,
             preprocess.dye_bias, preprocess.bmiq, preprocess.RawSignal,
             preprocess.load_manifest, preprocess.manifest_record,
             preprocess.load_mask, preprocess.mask_report, preprocess.apply_mask]
    r: []

  - title: Preprocessing
    desc: >-
      Getting a matrix into the shape every clock assumes: bare probe
      identifiers, values in the beta range, a known platform. The EPIC v2 step
      is mandatory rather than optional -- without it a v2 dataset overlaps
      almost nothing and the clocks score imputed values.
    python: [prepare_clinical, qc, probe_loss, preprocess.aggregate_replicate_probes,
             preprocess.impute, fit_batch_reference, apply_batch_reference,
             preprocess.BatchReference, preprocess.prepare_proteomic,
             preprocess.prepare_transcriptomic, preprocess.rle_normalise,
             preprocess.yugene, preprocess.median_centre, preprocess.horvath_normalise]
    r: [horvath_normalise, qc, probe_loss, fit_batch_reference, apply_batch_reference]

  - title: Uncertainty
    desc: >-
      How much of a score is the assay, and how far it is likely to be from the
      truth. Two different questions with two different answers, kept apart on
      purpose: technical replicates of the same DNA differ by up to nine years
      on prominent clocks, and a point estimate says nothing about either.
    python: [interval, icc_from_replicates, uncertainty.load_probe_icc,
             uncertainty.probe_icc_source, uncertainty.load_conformal]
    r: [interval, icc_from_replicates]

  - title: Study design
    desc: >-
      The commands that come before the first array and after the last one. How
      many samples an effect needs, given the clock's own reliability; and
      whether a difference that turned up survives the multi-clock rule that a
      re-analysis of six intervention datasets says it must.
    python: [power, detectable_effect, registry.evidence]
    r: [power_n]

  - title: Scoring
    desc: The predict loop, its result object, and the provenance it carries.
    python: [combine]
    r: [combine, coverage, manifest, write_results]

  - title: The clock catalogue
    desc: >-
      178 clocks in three availability groups: 69 bundled, 52 untraced and 57
      licensed scaffolds whose coefficients are research-use-only or have no
      public source FALCONAge may redistribute. The registry says which, why,
      and which bundled clocks answer the same question.
    python: [registry.load, registry.ClockRegistry, registry.Clock,
             registry.register_local_weights]
    r: [list_clocks, clock_info, cite_clock, compatible_clocks, register_local_weights]

  - title: Analysis
    desc: >-
      Age acceleration in its three conventions, association and survival
      models, reliability, and the AA1/AA2 benchmark. Each is gated on the
      clock's scale type -- acceleration on a pace-of-aging clock is a units
      error, not a conservative choice.
    python: [cell_composition, associate, cox_hazard, agreement, icc, run_benchmark,
             leave_one_marker_out]
    r: [cell_composition, associate, cox_hazard, agreement, icc, run_benchmark]

  - title: Your own clocks
    desc: >-
      Compare learners on your own cohort, fit the one you choose, combine
      several clocks into one score, and add any of them to the catalogue for
      a session so it is scored like a published clock. Every reported number
      is out of fold.
    python: [compare_learners, fit_clock, stack_clocks, add_clock]
    r: [compare_learners, fit_clock, stack_clocks, add_clock, clock_to_file]

  - title: Clinical references
    desc: >-
      KDM and homeostatic dysregulation have no fixed coefficients: both are
      defined relative to a reference cohort, and the manifest records which.
    python: [models.fit_kdm, models.fit_hd, models.clinical.phenoage, blood_count_ratios]
    r: [fit_kdm, fit_hd]

  - title: Model architectures
    desc: >-
      Not every clock is a dot product. The mitotic clocks summarise a probe set
      with a mean or a percentile; AltumAge is a dense network read from a
      safetensors file; scAge asks a different question entirely, one age per
      cell from a methylome that is 99% missing.
    python: [models.AggregationClock, models.NeuralClock, models.read_neural_weights,
             models.ScAgeReference,
             models.fit_scage_reference, models.scage]
    r: []

  - title: Figures and reports
    desc: >-
      Every plot returns its data as well as its figure, which is how the two
      languages draw the same numbers with different engines. Figures carry
      axes and legend only; `save_figure` writes each as `<title>.png` with
      its title, numbers and description in `<title>.txt`. `clock_atlas` is
      the exception in scale rather than in kind: one figure covering every
      clock across every pooled study, for the case where a per-clock panel
      would need forty of them.
    python: [plot.clock_coverage_manhattan, plot.clock_coverage_points, plot.ba_vs_ca, plot.bland_altman, plot.calibration,
             plot.acceleration_density, plot.acceleration_by_group,
             plot.acceleration_heatmap, plot.forest, plot.kaplan_meier, plot.volcano,
             plot.clock_corr, plot.clock_radar, plot.clock_chord, plot.clock_pca,
             plot.clock_atlas, plot.coverage_bar, plot.missingness, plot.beta_density,
             plot.platform_comparison, plot.study_comparison, plot.benchmark_bars,
             plot.benchmark_error_bias, plot.benchmark_heatmap,
             plot.reliability_forest, plot.score_interval, plot.platform_bias,
             plot.consensus_plot, plot.palette, plot.save_all, plot.save_figure,
             plot.figure_text, plot.read_caption, report.write_report,
             report.write_quarto_report]
    # pkgdown refuses to build when an exported topic is in no group, so this
    # list is not optional documentation -- it is a build dependency. The
    # coverage check in build_docs.py compares it against r/man/*.Rd and fails
    # first, with a better message than pkgdown's.
    r: [plot_clock_coverage, plot_ba_vs_ca, plot_bland_altman, plot_calibration, plot_acceleration,
        plot_acceleration_by_group, plot_acceleration_heatmap, plot_forest,
        plot_agreement, plot_clock_radar, plot_clock_chord, plot_clock_pca,
        plot_clock_atlas, plot_coverage, plot_by_platform, plot_kaplan_meier,
        plot_volcano, plot_benchmark, plot_benchmark_error_bias,
        plot_benchmark_heatmap, falcon_palette, falcon_scheme, falcon_theme,
        save_figure, figure_text, report, quarto_report]

  - title: Downloading public data
    desc: >-
      Accession in, files and a normalised sample table out. Credentialed
      archives are documented rather than automated -- the access agreement is
      the user's, not the tool's.
    python: [download, download.cache_info, download.clear_cache]
    r: [download, cache_info, clear_cache]

  - title: Configuration and setup
    desc: What resolved, on this machine, in this environment.
    python: [config, configure, core.resolve, core.describe, FalconConfig, RunManifest]
    r: [falconage_install, falconage_config, falconage_available]

# =============================================================================
# The R-to-Python correspondence
# =============================================================================
#
# Which R function is the same computation as which Python one. This CANNOT be
# derived from the lists above: they are ordered by subject, not by
# correspondence, and the two languages have different numbers of entries per
# group. A first attempt paired them positionally and produced a table claiming
# `report()` was `fa.plot.palette()`, which is worse than having no table.
#
# So it is stated once, here, and build_docs.py checks every name against the
# group it sits in -- a typo or a rename fails the build rather than rendering
# a wrong row.
#
# Anything not named here is genuinely one-sided and is rendered as such. That
# is information too: it is how a reader learns that `obs()` has no Python
# counterpart because Python reaches the same field as an attribute.
pairs:
  Your own clocks:
    - [compare_learners, compare_learners]
    - [fit_clock, fit_clock]
    - [stack_clocks, stack_clocks]
    - [add_clock, add_clock]
  Start here:
    - [as.data.frame.falcon_result, FalconResult]
    - [read_betas, read_betas]
    - [prepare, prepare]
    - [technical_se, technical_se]
    - [conformal_interval, conformal_interval]
    - [consensus, consensus]
    - [score, score]
    - [interpretation, FalconResult.interpretation]
    - [acceleration, acceleration]
    - [run_report, report.run_report]
  Reading data:
    - [read_series_matrix, read_series_matrix]
    - [read_clinical, read_clinical]
    - [read_rrbs_dir, read_rrbs_dir]
    - [falcon_data, FalconData]
    - [obs, FalconData.obs]
    - [write_h5ad, FalconData.write_h5ad]
  Preprocessing:
    - [horvath_normalise, preprocess.horvath_normalise]
    - [qc, qc]
    - [probe_loss, probe_loss]
    - [fit_batch_reference, fit_batch_reference]
    - [apply_batch_reference, apply_batch_reference]
  Uncertainty:
    - [interval, interval]
    - [icc_from_replicates, icc_from_replicates]
  Study design:
    # power_n, not power: `power` is base R's exponent helper and shadowing it
    # in a package a user has attached is a worse trade than one differing name.
    - [power_n, power]
  Scoring:
    - [combine, combine]
    - [coverage, FalconResult.coverage]
    - [manifest, FalconResult.manifest]
    - [write_results, FalconResult.write]
  The clock catalogue:
    - [list_clocks, registry.ClockRegistry]
    - [clock_info, registry.Clock]
    - [register_local_weights, registry.register_local_weights]
    - [cite_clock, registry.Clock.cite]
    - [compatible_clocks, registry.ClockRegistry.compatible_with]
  Analysis:
    - [cell_composition, cell_composition]
    - [associate, associate]
    - [cox_hazard, cox_hazard]
    - [agreement, agreement]
    - [icc, icc]
    - [run_benchmark, run_benchmark]
  Clinical references:
    - [fit_kdm, models.fit_kdm]
    - [fit_hd, models.fit_hd]
  Figures and reports:
    - [plot_clock_coverage, plot.clock_coverage_manhattan]
    - [save_figure, plot.save_figure]
    - [figure_text, plot.figure_text]
    - [plot_ba_vs_ca, plot.ba_vs_ca]
    - [plot_bland_altman, plot.bland_altman]
    - [plot_calibration, plot.calibration]
    - [plot_acceleration, plot.acceleration_density]
    - [plot_acceleration_by_group, plot.acceleration_by_group]
    - [plot_acceleration_heatmap, plot.acceleration_heatmap]
    - [plot_forest, plot.forest]
    - [plot_kaplan_meier, plot.kaplan_meier]
    - [plot_volcano, plot.volcano]
    - [plot_agreement, plot.clock_corr]
    - [plot_clock_radar, plot.clock_radar]
    - [plot_clock_chord, plot.clock_chord]
    - [plot_clock_pca, plot.clock_pca]
    - [plot_clock_atlas, plot.clock_atlas]
    - [plot_coverage, plot.coverage_bar]
    - [plot_by_platform, plot.platform_comparison]
    - [plot_benchmark, plot.benchmark_bars]
    - [plot_benchmark_error_bias, plot.benchmark_error_bias]
    - [plot_benchmark_heatmap, plot.benchmark_heatmap]
    - [falcon_palette, plot.palette]
    - [report, report.write_report]
    - [quarto_report, report.write_quarto_report]
  Downloading public data:
    - [download, download]
    - [cache_info, download.cache_info]
    - [clear_cache, download.clear_cache]
  Configuration and setup:
    - [falconage_config, config]

# =============================================================================
# The reading order of the site
# =============================================================================
#
# Ordered parts, in the order somebody learns the material: what the tool is,
# using it, the clocks, the science, the API, the internals. Each part belongs
# to one navbar section, and each section has its own sidebar, so a reader sees
# where they are at the top and what is near them on the left.
#
# `book` is the source for the navbar, the sidebars, the compact menu shown on
# narrow screens, and the downloadable PDF. `articles` and `pages` below are
# kept because pkgdown's own navbar is generated from them.
book:
  # `section` names the navbar entry the part belongs to; every section gets
  # its own sidebar (see `sections` below), so a page shows only its section.
  - part: Start here
    section: start
    chapters:
      - title: Overview
        file: index.qmd
      - title: Install
        file: start/install.qmd
      - title: Your first run
        file: start/quickstart.qmd
      - title: About and design
        file: start/about.qmd
      - title: Using FALCONAge from Claude
        file: start/claude.qmd
  - part: Your data
    section: guide
    chapters:
      - title: Loading your data
        file: data/loading.qmd
      - title: Preprocessing and coverage
        file: data/preprocessing.qmd
      - title: Raw arrays to betas
        file: data/raw-arrays.qmd
  - part: Analysis
    section: guide
    chapters:
      - title: Age acceleration
        file: analysis/acceleration.qmd
      - title: Uncertainty
        file: analysis/uncertainty.qmd
      - title: Clinical chemistry and survival
        file: analysis/clinical.qmd
      - title: Benchmarking
        file: analysis/benchmarking.qmd
      - title: Beyond the clock score
        file: analysis/beyond.qmd
      - title: Figures and reports
        file: analysis/reporting.qmd
      - title: Figure gallery
        file: analysis/figures.qmd
  - part: Your own clocks
    section: guide
    chapters:
      - title: Build a clock
        file: own/compare.qmd
      - title: Add a clock
        file: own/add.qmd
      - title: Stack clocks
        file: own/stack.qmd
  - part: Clocks
    section: clocks
    chapters:
      - title: Choosing a clock
        file: clocks/choosing.qmd
      - title: What a score means
        file: clocks/meaning.qmd
      - title: Clock catalogue
        file: clocks/catalogue.qmd
      - title: Known discrepancies
        file: clocks/discrepancies.qmd
  - part: Methods
    section: methods
    chapters:
      - title: Published formulas
        file: methods/formulas.qmd
      - title: From raw arrays to betas
        file: methods/raw-arrays.qmd
      - title: Uncertainty, specimen and platform
        file: methods/uncertainty.qmd
      - title: Downstream statistics
        file: methods/downstream.qmd
      - title: Benchmarking and validation
        file: methods/benchmarking.qmd
      - title: Building a clock
        file: methods/building.qmd
  - part: Reference
    section: api
    chapters:
      - title: Python reference
        file: reference/index.qmd
      - title: R reference
        href: r/index.html
      # What the bracketed numbers on every other page point at.
      - title: References
        file: references.qmd
  # What a contributor reads, not what a user needs. Its own navbar entry and
  # sidebar, and left out of the downloadable PDF.
  - part: Developer notes
    section: dev
    chapters:
      - title: Architecture
        file: dev/index.qmd
      - title: Core engine and registry
        file: dev/engine.qmd
      - title: Algorithms
        file: dev/algorithms.qmd
      - title: Modules
        file: dev/modules.qmd
      - title: R package
        file: dev/r-package.qmd
      - title: Docker, testing and CI
        file: dev/operations.qmd
      - title: Testing against the public corpus
        file: dev/testing.qmd
      - title: Design history
        file: dev/history.qmd
      - title: Other software
        file: dev/software.qmd
      - title: Appendices
        file: dev/appendices.qmd

# The navbar, in order. Each entry links to the first page of its section, and
# each section has its own sidebar holding only its own parts.
sections:
  - id: start
    title: Get started
  - id: guide
    title: Guide
  - id: clocks
    title: Clocks
  - id: methods
    title: Methods
  - id: api
    title: API
  - id: dev
    title: Developers

articles:
  - title: Getting started
    file: FALCONAge
    desc: Install, score, interpret. Both languages.
  - title: Choosing a clock
    file: clocks
    desc: >-
      By the question you asked, by what the scale permits, and by whether the
      clock's coefficients transfer to your data at all.

# Pages that are neither a guide nor generated reference. The pkgdown navbar
# links across to the same rendered pages rather than duplicating five thousand lines into
# r/vignettes/ -- which would put them in the CRAN tarball, where a reference
# manual is welcome and a literature review is not.
pages:
  - title: Your first run
    file: start/quickstart.qmd
    desc: Run the demo, read what a run writes, then run your own data.
  - title: Published formulas
    file: methods/formulas.qmd
    desc: The exact formulas FALCONAge implements, each checked against its source.
  - title: Figure gallery
    file: analysis/figures.qmd
    desc: >-
      Every figure the package draws, on the public corpus, each with the same
      interpretation the figure itself prints under its axes.
  - title: Clock catalogue
    file: clocks/catalogue.qmd
    desc: All 178 entries, generated from the registry that scores them.
  - title: Architecture
    file: dev/index.qmd
    desc: Which file computes what, and why.

# The offline copies docs/build_downloads.py produces. Listed here so the
# navbar and the build agree on the filenames -- a Download menu whose links
# 404 is worse than no menu.
#
# Two artefacts, not three. A separate R reference manual would need `R CMD
# Rd2pdf` and therefore a LaTeX install; the R help pages travel in the
# markdown bundle instead, converted from pkgdown's HTML. Both PDFs collapsed
# into one for the same reason the API pages are not in it: see the note at the
# top of build_downloads.py.
downloads:
  - title: Documentation (PDF)
    file: FALCONAge.pdf
  - title: Documentation (markdown ZIP)
    file: FALCONAge-docs-markdown.zip
