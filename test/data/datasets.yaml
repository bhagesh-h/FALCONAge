# =============================================================================
# FALCONAge - public test corpus
# =============================================================================
#
# One manifest, two fetchers. fetch_test_data.py and fetch_test_data.R both read
# this file and must produce a byte-identical checksums.sha256 from it; that
# equality is the corpus-level version of the R/Python conformance gate in
# the design notes, and Dockerfile.testdata asserts it at build.
#
# Nothing here is redistributed. Every entry is a URL at the original publisher,
# and everything the fetchers write is excluded by .gitignore. The corpus is
# reproducible from this file, not stored alongside it.
#
# CHECKSUMS. Hugging Face publishes the SHA-256 of every LFS object, so the
# eleven ComputAgeBench files carry a real one and a mismatch is a hard error.
# GEO and GitHub publish none, so those entries carry only an expected size: the
# fetcher warns on a size mismatch, records the SHA-256 it observed, and checks
# every later run against that recorded value. Trust on first use, stated
# plainly rather than dressed up as verification.
#
# BUDGET. 585,710,669 bytes over 33 files, against a declared ceiling of 1 GB.
# The fetcher refuses a selection that would cross the ceiling and prints the
# arithmetic; raise it with --max-bytes if you mean to.
# -----------------------------------------------------------------------------

schema_version: 1

# The ceiling, in bytes. SI gigabytes, not gibibytes -- the smaller reading, so
# a corpus that satisfies this satisfies either.
budget_bytes: 1000000000

# Sum of every `bytes:` below. --self-test asserts the files add up to this, so
# a hand-edited entry that drifts from its source is caught at build rather than
# halfway through a download.
expected_total_bytes: 585710669
expected_total_files: 33

# -----------------------------------------------------------------------------
# Where the data comes from, and under what terms
# -----------------------------------------------------------------------------
sources:

  computage_bench:
    name: ComputAgeBench
    homepage: https://huggingface.co/datasets/computage/computage_bench
    licence: CC-BY-SA-4.0
    checksums: published
    revision: 3cf52681537b303a5b7e21df03a3ae0a94ed497e
    citation: >-
      Kriukov D, Efimov E, Kuzmina EA, Khrameeva EE, Dylov DV (2024).
      ComputAgeBench: Epigenetic Aging Clocks Benchmark. bioRxiv 2024.06.06.597715.
    note: >-
      Pinned to a commit, not to main. The published benchmark is a fixed set of
      65 studies; a moving reference would let the corpus change under a result
      that cites it.

  geo:
    name: NCBI Gene Expression Omnibus
    homepage: https://www.ncbi.nlm.nih.gov/geo/
    licence: >-
      Public. NCBI places no restriction on use or reproduction; individual
      submitters' terms and the source publications' terms still apply, and
      several of these series are human subject data reused under the consent
      the original study obtained.
    checksums: none
    note: >-
      GEO publishes file sizes in filelist.txt but no digests, and a submitter
      can replace a supplementary file in place without changing its name. Every
      size below was read from the live listing on 2026-08-07.

  bioage:
    name: BioAge (Kwon & Belsky)
    homepage: https://github.com/dayoonkwon/BioAge
    licence: GPL-3.0
    checksums: none
    citation: >-
      Kwon D, Belsky DW (2021). A toolkit for quantification of biological age
      from blood chemistry and organ performance tests: the BioAge R package.
      GeroScience 43, 2795-2808.
    note: >-
      These .rda files are NHANES III and NHANES IV extracts. NHANES itself is a
      US federal public-domain dataset; the extraction, harmonisation and
      variable naming are the BioAge authors' work and are GPL-3.

# -----------------------------------------------------------------------------
# Groups. Fetch all of them, or name the ones you need:
#   --groups bench,clinical
# -----------------------------------------------------------------------------
groups:

  # ===========================================================================
  - id: bench
    default: true
    title: ComputAgeBench case/control methylation
    bytes: 368410440
    samples: 261
    platforms: [27K, 450K, EPICv1]
    why: >-
      The AA1/AA2 benchmark in README section 11 asks whether a clock reports
      higher age acceleration in people with an aging-accelerating condition
      than in their own controls. That question needs case/control cohorts, not
      an age-diverse healthy panel, and it needs several of them: a clock that
      wins on one dataset has won nothing. These ten are the smallest studies in
      the published 65-study benchmark that still span three array generations
      and eight conditions.
    covers: >-
      Every clock that takes human blood methylation and returns a number --
      first and second generation, causal, mitotic, telomere, lifestyle,
      disease-risk, frailty, single-CpG, deconvolution, sex dosage. That is the
      bulk of the 161.
    caveats: >-
      Stored as float32. Fine for benchmarking, wrong for gold-standard vectors:
      the 1e-6 FP64 assertions in the design notes need a source
      carrying full double precision, which these do not.
    files:
      - path: bench/computage_bench_meta.tsv
        source: computage_bench
        url: https://huggingface.co/datasets/computage/computage_bench/resolve/3cf52681537b303a5b7e21df03a3ae0a94ed497e/computage_bench_meta.tsv
        bytes: 635321
        note: >-
          Sample table for all 65 studies: SampleID, DatasetID, PlatformID,
          Tissue, CellType, Gender, Age, Condition, Class. One file covers every
          parquet below, so condition labels and ages never have to be scraped
          out of GEO characteristics strings.

      - path: bench/GSE182991.parquet
        source: computage_bench
        url: https://huggingface.co/datasets/computage/computage_bench/resolve/3cf52681537b303a5b7e21df03a3ae0a94ed497e/data/benchmark/computage_bench_data_GSE182991.parquet
        bytes: 93697978
        sha256: "04c9b1bc248f014dc4cbc552a3108cffcaf839b98077505857941506b60ce579"
        note: >-
          Hutchinson-Gilford progeria, 15 cases and 12 controls, EPICv1, ages
          0-41. The strongest positive control in the corpus: if a second
