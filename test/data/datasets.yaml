      Every other methylation file here is somebody else's beta matrix,
      normalised by a pipeline whose choices are not recorded. The IDAT path --
      parse, noob, BMIQ, detection-p, cross-reactive and SNP probe masks -- is
      the only one FALCONAge controls end to end, and it is the one that decides
      whether two labs' numbers are comparable. Four samples is enough to test
      it and 60 MB is what four samples cost.
    covers: >-
      preprocess/methylation/{idat, noob, bmiq, sesame, quality, platform},
      and the two-channel Grn/Red pairing that a naive per-file loop gets wrong.
    caveats: >-
      Two samples per platform. Enough for correctness, not enough for a
      normalisation that estimates its parameters across a plate -- funnorm on
