    default: true
    title: Mammalian methylation array, three species
    bytes: 9310142
    samples: 29
    platforms: [MammalMethylChip40]
    why: >-
      MammalianLifespan, MammalianFemale and the three EnsembleAge clocks take
      the 37,554-probe mammalian array and a species annotation, and return
      relative age against that species' maximum lifespan. Human 450K data
      cannot exercise them: the probe namespace is different and the species
      lookup has nothing to look up.
    covers: >-
      MammalianLifespan, MammalianFemale, EnsembleAge x3, the species-lookup
      transforms in models/species.py, and the relative-age scale type.
    caveats: >-
      Two non-human species (Equus africanus somaliensis and Equus grevyi) plus
      human cells. The Mammalian Methylation Consortium's full matrix covers 348
      species, and it is a single 4.2 GB file -- four times this entire corpus
      for one group, so it is out of budget and named here rather than quietly
      omitted. Ages are in years with a decimal fraction, and the series carries
      a confidenceinageestimate field that is not 100 for every sample.
