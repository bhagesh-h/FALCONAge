  # ===========================================================================
  - id: gestational
    default: true
    title: Umbilical cord blood with gestational age
    bytes: 50802169
    samples: 22
    platforms: [450K]
    why: >-
      Seven clocks in the catalogue predict gestational age rather than
      chronological age, and their input is cord blood measured in days of
      gestation. Running them on adult blood produces a number with no meaning,
      which is worse than an error, so the corpus has to carry a set they can
      legitimately be scored on.
    covers: "Knight, Bohlin, Mayne, Lee (control / robust / refined-robust), EPICGA, and PedBE."
    caveats: >-
      Gestational age is recorded in DAYS here, 185 to about 280, while every
      one of these clocks predicts WEEKS. That conversion is exactly the kind of
      silent factor-of-seven the units module exists to refuse to guess, and
      this file is its test case.
    files:
      - path: gestational/GSE66459_series_matrix.txt.gz
        source: geo
        url: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE66nnn/GSE66459/matrix/GSE66459_series_matrix.txt.gz
        bytes: 50802169
        note: >-
          11 preterm and 11 term deliveries, 450K. A series matrix, so the
          sample characteristics (gestational_age in days, sex, tissue, mode of
          labour onset) and the beta values arrive in one file -- which is also
          why this is the fixture for the series-matrix reader in preprocess,
          the path about 60% of GEO methylation series need because they publish
          no IDATs.

  # ===========================================================================
  - id: epicv2
    default: true
    title: EPIC v2 probe-suffix handling
    bytes: 41174247
    samples: 8
    platforms: [EPICv2]
    why: >-
      EPIC v2 renamed its probes. cg00000029 became cg00000029_TC21, and a clock
      matching on exact identifiers therefore finds zero of its features and
      returns a confident number computed entirely from imputed values. Suffix
      aggregation is mandatory, not an optimisation, and it needs real EPIC v2
      identifiers to test against -- the replicate structure (some probes appear
      two or three times with different suffixes) cannot be faked convincingly.
    covers: >-
      aggregate_replicate_probes and detect_platform in preprocess/methylation,
      and the coverage warning every clock raises on a platform it was not
      trained for.
    caveats: >-
      Glycogen storage disease type 1a and controls, 8 samples. Chosen for its
      platform and its size, not its phenotype; it is not a benchmark set and
      should not be used as one.
    files:
      - path: epicv2/GSE330325_series_matrix.txt.gz
        source: geo
        url: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE330nnn/GSE330325/matrix/GSE330325_series_matrix.txt.gz
        bytes: 41174247
        note: >-
          Also carries the sample metadata for the two EPIC v2 IDAT pairs in the
          idat group, which come from this same series.

