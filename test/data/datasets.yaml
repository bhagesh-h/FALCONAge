  # ===========================================================================
  - id: mouse
    default: true
    title: Mouse blood RRBS across the lifespan
    bytes: 50223645
    samples: 4
    platforms: [RRBS]
    why: >-
      The mouse clocks are not array clocks. Petkovich, Meer, Stubbs and
      Thompson take reduced-representation bisulfite sequencing keyed by genomic
      coordinate (chr:position), not by cg identifier, and no array file in this
      corpus can stand in for that. This is also the corpus's only sequencing
      input, so it is the only thing that exercises coverage-weighted beta
      estimation -- an RRBS site read four times and one read four hundred times
      are not the same measurement, and a pipeline that treats them alike is
      wrong in a way an array pipeline never has to worry about.
    covers: >-
      Petkovich, Meer, Stubbs, Thompson, the RRBS reader, and coordinate-keyed
      feature alignment.
    caveats: >-
      GEO labels the age field "age (years)" and the values run 0.67 to 35.
      Those are MONTHS. A mouse does not live 35 years, and a clock handed 35 as
      a year value will report a 33-year acceleration and look precise doing it.
      This is the corpus's best argument for the design notes --
      units are declared, never inferred -- and it is a real published series,
      not a contrived example.
    files:
      - path: mouse/GSE80672_series_matrix.txt.gz
        source: geo
        url: https://ftp.ncbi.nlm.nih.gov/geo/series/GSE80nnn/GSE80672/matrix/GSE80672_series_matrix.txt.gz
        bytes: 12740
        note: >-
          Metadata for all 255 samples in the series: age, sex, strain, diet,
          genetic condition. 12.7 kB, so the whole cohort's design is available
          even though only four samples' data are fetched.
      - path: mouse/GSM2132712_20D02.overlap.txt.gz
        source: geo
        url: https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM2132nnn/GSM2132712/suppl/GSM2132712_20D02.overlap.txt.gz
        bytes: 11849652
        note: "C57BL/6, 0.67 months, male, standard diet, wild type."
      - path: mouse/GSM2132713_20D03.overlap.txt.gz
        source: geo
        url: https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM2132nnn/GSM2132713/suppl/GSM2132713_20D03.overlap.txt.gz
        bytes: 12851935
        note: "C57BL/6, 0.67 months, male, standard diet, wild type."
      - path: mouse/GSM2132959_M3503.overlap.txt.gz
        source: geo
        url: https://ftp.ncbi.nlm.nih.gov/geo/samples/GSM2132nnn/GSM2132959/suppl/GSM2132959_M3503.overlap.txt.gz
        bytes: 13167557
        note: >-
          C57BL/6, 35 months, male, standard diet, wild type. Paired with the
          0.67-month samples this is a 52-fold age range in four files, which is
