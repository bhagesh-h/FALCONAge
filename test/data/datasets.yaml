  # ===========================================================================
  - id: clinical
    default: true
    title: NHANES blood chemistry with mortality linkage
    bytes: 5350559
    samples: 0            # tens of thousands across two cohorts; counted at load, not asserted here
    platforms: [clinical_chemistry]
    why: >-
      PhenoAge, Klemera-Doubal and homeostatic dysregulation take blood
      chemistry, not methylation, and were fitted on NHANES III with NHANES IV
      as the validation cohort. Nothing in the methylation groups can exercise
      them; nothing else in the corpus can exercise the unit registry either,
      and units are where clinical clocks go wrong most often.
    covers: >-
      PhenoAge (both the SI and the conventional-unit variant), KDM, homeostatic
      dysregulation, and the mortality-linked survival analysis in README
      section 4.4.
    caveats: >-
      NHANES3_HDTrain is the healthy young reference subset the homeostatic
      dysregulation Mahalanobis distance is computed against. HD without it is
      not HD -- the statistic is defined relative to a reference population, and
      substituting the sample's own distribution silently changes what is being
      measured.
    files:
