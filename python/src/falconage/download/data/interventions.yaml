# =============================================================================
# Longitudinal interventional methylation studies
# =============================================================================
# The one kind of data this package had never been pointed at. Everything else
# it reads is cross-sectional: one sample per person, and the question is
# whether a clock's number is right. An intervention study asks whether the
# number MOVES, which is the question that decides whether a clock can be a
# trial endpoint at all.
#
# WHY A CURATED LIST RATHER THAN A SEARCH. "Find me methylation intervention
# studies" returns cross-sectional cohorts, animal work and studies with one
# timepoint. What makes a dataset usable here is narrow: the same individuals
# measured before and after something, with the pairing recoverable from the
# metadata. That is a judgement per study, and it is made here once.
#
# EVERY ENTRY DECLARES ITS ACCESS ROUTE, because three of the four routes are
# not a download. A partner dataset needs approval from two parties; a
# controlled-access one needs IRB review. Recording that as `access` means the
# tool can refuse with the actual next step rather than a 403.
#
# `size` is what the archive reports for the series and is approximate. A series
# with IDATs is one to two orders of magnitude larger than its beta matrix,
# which is why `want` matters more than the number.
#
# NOT EXHAUSTIVE, and not a substitute for Supplementary Table 1 of the
# TranslAGE paper, which is the authoritative mapping of study to accession for
# all 51 of their datasets. Entries here are the ones whose accession has been
# checked against the archive.

schema_version: 1

#: Where a dataset can actually be got from, and what that costs the user.
access_routes:
  open:
    label: "Open"
    how: "Downloads without an account."
  translage:
    label: "TranslAGE"
    how: >-
      Harmonised copies of the public datasets, ready to score. Browse and
      download at https://www.translage.io
    url: "https://www.translage.io"
  partner:
    label: "Partner, application required"
    how: >-
      TruDiagnostic partner datasets. Academic non-profit use only, and needs
      approval from BOTH TruDiagnostic and the original research partner.
      Apply at https://www.trudiagnostic.com/softwarerequest/
    url: "https://www.trudiagnostic.com/softwarerequest/"
  controlled:
    label: "Controlled access"
    how: >-
      Needs IRB review and a data use agreement with the study team. The
      contact is recorded per study.

