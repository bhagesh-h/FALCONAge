# FALCONAge clock registry
# 
# GENERATED by registry/build.py from the catalogue metadata and the
# extracted coefficient sets. Edit the generator, not this file.
# 
# availability: what a user has to do before this clock will score.
#   bundled   coefficients ship inside the wheel, traced to a named source
#   untraced  catalogued, but no primary source for the numbers is established
#   licensed  architecture implemented; the coefficients are not ours to give
#
# Words rather than A, B and C. The letters carried their meaning in this
# legend and nowhere else, so every error message, plot label and table
# column that printed one had to re-explain it or leave the reader guessing.
