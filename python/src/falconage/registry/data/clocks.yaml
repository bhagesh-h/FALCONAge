    generation: "causal"
    tissue: ["whole blood"]
    platform: ["450K"]
    predicts: ["adaptive epigenetic age"]
    training_target: ["chronological age"]
    unit: ["years"]
    scale_type: "age_years_relative"   # years, slope ~1, but no fixed origin -- see known_discrepancies
    model_type: "causality-weighted elastic net regression"
    population: "adults"
    n_features: 999
    requires_fp64: false
    availability: "bundled"
    citation: "Ying, K., Liu, H., Tarkhov, A.E. et al. Causality-enriched epigenetic age uncouples damage and adaptation. Nature Aging 4, 231–246 (2024)."
    doi: "https://doi.org/10.1038/s43587-023-00557-0"
    notes: "Causality-enriched age predictor restricted to adaptive/protective age-related CpGs, with feature penalties weighted by EWMR causality scores."
    known_discrepancies:
      - >-
        Scored across three healthy cohorts in the FALCONAge corpus, this clock's median offset against chronological age swings 162 years between datasets while Horvath2013's swings 15; DamAge and AdaptAge move as near mirror images (r = -0.975) and the swing in their sum is only 33, so the cause is one dataset-level shift amplified by their opposing intercepts of +543.43 and -511.97 rather than a fault in either. The slope against age is sound (0.967 pooled for DamAge). The scale is therefore age_years_relative: the residual and group differences are defined, predicted-minus-chronological is not.
      - "The paper reports 1,000 CpGs; the coefficient set carries 999. The same off-by-one
        appears in all three Ying clocks, consistent with the paper's total counting an
        intercept row as a feature."
