    doi: "https://doi.org/10.1186/s13059-016-1063-4"
    notes: "Gestational-age LASSO for cord blood, as the authors' predictGA package applies it by default: the one-standard-error model, 96 CpGs, fitted in days and returned here in weeks. The minimum-lambda model (251 CpGs) that biolearn, methylCIPHER and pyaging carry is the package's non-default option."
    known_discrepancies:
      - "The paper reports 96 CpGs; the coefficient set in circulation carries 251. Scores here
        will match other packages and not the figures printed in the paper."
    coefficient_source:
