  # ---------------------------------------------------------------------------
  # Two clinical clocks that are fitted rather than downloaded. Neither has a
  # coefficient file anywhere, by construction: KDM regresses each biomarker on
  # age in a reference cohort and inverts, and homeostatic dysregulation is a
  # Mahalanobis distance to a reference centre. Both carry their reference with
  # them (fit_reference=), which is why they are tier A with nothing to ship.
  # ---------------------------------------------------------------------------
  kdm:
    name: "Klemera-Doubal method biological age"
    year: 2006
    species: "Homo sapiens"
    data_type: "clinical_chemistry"
    generation: "second"
    tissue: ["blood"]
    platform: ["clinical laboratory assays"]
    predicts: ["biological age"]
    training_target: ["chronological age"]
    unit: ["years"]
    scale_type: "age_years"
    model_type: "clinical_formula"
    population: "adults"
    n_features: null
    requires_fp64: false
    availability: "bundled"
    citation: "Klemera, P. and Doubal, S. \"A new approach to the concept and computation of biological age.\" Mechanisms of Ageing and Development 127.3 (2006): 240-248."
    doi: "https://doi.org/10.1016/j.mad.2005.10.004"
    notes: "Biological age as the maximum-likelihood age given a panel of biomarkers, each regressed on chronological age in a reference population. Has no fixed coefficients: the regressions are refitted on the reference cohort supplied at score time, so the same panel gives different numbers against NHANES III and against a local cohort, and the manifest records which was used."
    formula: "kdm"
    requires_covariates: ["age"]
    requires_reference: true
    coefficient_source:
      file: null
      url: null
      provenance: "no coefficients exist; fitted from the reference cohort at score time"
      primary_source_traced: true
