  pcdnamtl:
    name: "pcdnamtl"
    year: 2022
    species: "Homo sapiens"
    data_type: "dna_methylation"
    generation: "other"
    tissue: ["whole blood"]
    platform: ["450K"]
    predicts: ["leukocyte telomere length"]
    training_target: ["DNAmTL output"]
    unit: ["base pairs"]
    scale_type: "telomere_kb"
    model_type: "PCA + elastic net regression"
    population: "adults"
    n_features: null
    requires_fp64: true
    availability: "licensed"
    citation: "Higgins-Chen, Albert T., et al. \"A computational solution for bolstering reliability of epigenetic clocks: implications for clinical trials and longitudinal tracking.\" Nature Aging 2 (2022): 644–661."
    doi: "https://doi.org/10.1038/s43587-022-00248-2"
    notes: "Principal-component proxy trained to reproduce the original DNAmTL clock score; the implemented returned score is on the DNAmTL base-pair scale."
    reliability:
      source: "Higgins-Chen et al., Nature Aging 2022;2:644-661."
      note: "A principal-component rebuild of the original clock, trained to suppress single-probe
        technical noise. Replicate pairs agree to within 0-1.5 years against deviations of up to 9
        years for the original. The paper reports agreement in years, not a per-clock ICC, so no ICC
        is recorded here."
    coefficient_source:
      file: null
      url: null
      provenance: "The authors' CalcAllPCClocks.RData (MorganLevineLab/PC-Clocks at 5e65bce, which links it on Yale Box); neither carries a licence, so it is not redistributed."
      primary_source_traced: true
      redistributable: false
      why: "The PC-Clocks repository and its data file carry no licence, so the rotations, weights and imputation values are not ours to distribute."
      obtain: "Download CalcAllPCClocks.RData from the Yale Box link in the PC-Clocks README (https://github.com/MorganLevineLab/PC-Clocks), then fa.registry.load().import_pc_clocks(path), which registers pchorvath2013, pcskinandblood, pchannum, pcphenoage and pcdnamtl with the authors' weights and their imputeMissingCpGs values. Needs Rscript, which the FALCONAge image has."
      alternatives: []
    preprocess: []
