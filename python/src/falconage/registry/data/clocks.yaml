    notes: "Ten-CpG whole-blood mortality risk score. Pyaging implements the paper supplement's continuous LASSO-weighted score exactly (the sum of ten raw beta values multiplied by their published coefficients). The same study also defines a separate simplified 0-10 aberrant-methylation count based on cohort-specific quartile cutoffs."
    known_discrepancies:
      - "The paper defines this as an integer count of markers past quartile thresholds; the
        implementations in circulation compute a continuous weighted sum. They are different
        statistics, and the continuous form has no published cut-points. FALCONAge scores the
        continuous sum of the LASSO Cox weights, a log hazard (scale_type mortality_log_hazard),
        not the count."
