      file: "coefficients/yingadaptage.csv"
      sha256: "c844962e50847593de78b22742e69665ad767756a94806573a906914334e22ee"
      provenance: "Ying et al. 2024, Nature Aging, Supplementary Data (43587_2023_557_MOESM6_ESM.zip, YingAdaptAge.csv): the 999 coefficients and the intercept -511.9742762, identical to this file and to the add step below."
