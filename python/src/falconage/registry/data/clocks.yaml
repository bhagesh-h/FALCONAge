    predicts: ["total-to-HDL cholesterol ratio"]
    training_target: ["total-to-HDL cholesterol ratio"]
    unit: ["ratio"]
    scale_type: "relative_score"
    model_type: "LASSO regression"
    population: "adults"
    n_features: 412
    requires_fp64: false
    availability: "bundled"
    citation: "McCartney, D. L., et al. “Epigenetic prediction of complex traits and death.” Genome Biology 19, 136 (2018)."
    doi: "https://doi.org/10.1186/s13059-018-1514-1"
    notes: "Whole-blood DNAm LASSO score for total-to-HDL cholesterol ratio, trained in Generation Scotland on an age-, sex-, and ancestry-adjusted phenotype residual and evaluated out of sample in LBC1936."
    known_discrepancies:
      - "The paper defines this predictor as a weighted sum of beta values and
        applies no link function; the ROC analysis it reports dichotomises the
        phenotype, not the score. Packages that pass the sum through a sigmoid
        report a different number. The scale is relative_score, whose legal
        operations are correlate and rank, and a sigmoid is monotone, so no
        permitted result changes either way."
    coefficient_source:
      file: "coefficients/mccartneytotalhdlratio.csv"
      sha256: "347255f1318d6177811590217fa61d8017b4d176c392c46a3082485f779620ae"
      url: "https://doi.org/10.1186/s13059-018-1514-1"
      provenance: "McCartney et al. 2018, Genome Biology 19:136, Additional file 1, sheet 'Table S8 - Total-HDL ratio' (CC BY): 412 probes with LASSO weights, the predictor the paper evaluates. Probe ids are kept as published, including the ch. non-CpG probes."
      primary_source_traced: true
      redistributable: true
    reference_values:
