    doi: "https://doi.org/10.1371/journal.pone.0014821"
    notes: "Package-facing one-CpG identity score: pyaging returns raw cg09809672 methylation with coefficient 1 and zero intercept. The published saliva age regression instead uses EDARADD and NPTX2, including an EDARADD-squared basis term; that published age model is not implemented."
    known_discrepancies:
      - "The paper describes a 2-CpG model; the coefficient set in circulation carries 1. Which
        probe was dropped is not documented upstream, so this is not the published model."
    coefficient_source:
      file: null
      url: "https://doi.org/10.1371/journal.pone.0014821"
      provenance: "no array-scale model was ever published; the paper's regression is not in Illumina beta units"
      primary_source_traced: false
      redistributable: null
      why: "Checked against the paper rather than assumed. The published model regresses age on EDARADD methylation, EDARADD squared and NPTX2, measured by Sequenom MassArray and by pyrosequencing, and the paper prints an R-squared rather than coefficients. There is no equation in beta units to implement. What other packages ship under this name is the raw cg09809672 beta with weight 1, which is a probe readout and not an age."
      obtain: "not obtainable as published: the regression coefficients are in neither the paper nor its supplement"
    preprocess: []
    postprocess: []

