      sha256: "34bcd8d1911c6141b3cc89f37bd867e1632fb2f37c5f1679a3d57a0e976ef6fc"
      provenance: "Bohlin et al. 2016's own R package predictGA (github.com/JonBohlin/predictGA, commit 242801d, GPL (>= 2), as the paper's availability statement gives it): the cv.glmnet object UL.mod.cv at lambda.1se, which predictGA() uses by default ('model performance is comparable to minimum lambda, therefore it is default'): 96 CpGs and the intercept 272.68274063649744, in days. The 73 CpGs of the paper's Additional file 1 Table S3 (ultrasound model) are all among them. biolearn and methylCIPHER carry the lambda.min model instead (251 CpGs, intercept 277.2421)."
      primary_source_traced: true
      redistributable: true
    preprocess: []
    postprocess:
      - {op: "add", value: 272.68274063649744}
      - {op: "days_to_weeks"}

