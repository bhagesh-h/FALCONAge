    species: "Homo sapiens"
    data_type: "dna_methylation"
    generation: "other"
    tissue: ["cultured fibroblasts"]
    platform: ["EPICv1"]
    predicts: ["cell-population passage age"]
    training_target: ["cell passage number"]
    unit: ["passages"]
    scale_type: "relative_score"
    model_type: "elastic net regression"
    population: "human cell cultures"
    n_features: 42
    requires_fp64: false
    availability: "bundled"
    citation: "Lujan, Celia, et al. \"An expedited screening platform for the discovery of anti-ageing compounds in vitro and in vivo.\" Genome Medicine 16 (2024): 85."
    doi: "https://doi.org/10.1186/s13073-024-01349-w"
    notes: "CellPopAge is an elastic-net DNA-methylation clock using 42 selected CpGs to predict passage-based age of serially cultured adult primary human fibroblast populations and screen compounds that decelerate this measure."
    coefficient_source:
      file: "coefficients/cellpopage.csv"
      sha256: "872055792099852ade7a3aeb80189a6a5b9d51c0807fe7d2915e586b04eb37b0"
      provenance: "The authors' release (github.com/ucl-medical-genomics/CellPopAge-epigenetic-clock, commit 7bce6e3, MIT): model/nbeta.npy, intercept 11.5267892697821 and 42 non-zero coefficients on the probes of model/probes.npy; the same 42 probes as Lujan et al. 2024 Additional file 2 Table S1, and identical to methylCIPHER (github.com/HigginsChenLab/methylCIPHER, commit bfe5d02, BSD-3-Clause). Their run_clock.py on their test_data/beta_test.csv is reproduced to 4e-15."
      primary_source_traced: true
      redistributable: true
    preprocess: []
    postprocess:
      - {op: "add", value: 11.5267892697821}

  corticalclock:
    name: "corticalclock"
    year: 2020
    species: "Homo sapiens"
    data_type: "dna_methylation"
    generation: "first"
    tissue: ["brain cortex"]
    tissue_policy: "refuse"   # brain cortex; post-mortem neural tissue, no peripheral counterpart
    platform: ["450K"]
    predicts: ["chronological age"]
    training_target: ["chronological age"]
    unit: ["years"]
    scale_type: "age_years"
    model_type: "elastic net regression"
    population: "human, age unspecified"
    n_features: 347
    requires_fp64: false
    availability: "bundled"
    citation: "Shireby, G. L., et al. \"Recalibrating the epigenetic clock: implications for assessing biological age in the human cortex.\" Brain 143.12 (2020): 3763-3775."
    doi: "https://doi.org/10.1093/brain/awaa334"
    notes: "Cortex-specific DNA-methylation chronological-age estimator trained by elastic net on 1,047 post-mortem cortical samples; its 347-CpG weighted score is back-transformed to years."
    coefficient_source:
      file: "coefficients/corticalclock.csv"
      sha256: "257a23aec7b690c3ef7b2718b542872153af239c907f1197b9df10e8a07d6207"
      url: "https://github.com/gemmashireby/CorticalClock"
      provenance: "Shireby et al. 2020, Brain 143(12):3763-3775, Supplementary Table 3 (CC BY): 347 sites with regression coefficients, the count the paper states. The machine-readable copy bundled here is PredCorticalAge/CorticalClockCoefs.txt from the authors' own reference implementation, which is also where the intercept comes from: the supplement prints the weights, and CorticalClock.r prints the offset applied to their sum as 0.577682570446177."
      primary_source_traced: true
      redistributable: true
    reference_values:
      file: "references/corticalclock.csv"
      sha256: "cdd5e5cea074d4392705f88d5c19ff70621d489ed34c7d6d8eb07354f76a8b62"
      label: "mean of 700 control cortical samples (authors' reference)"
      provenance: "gemmashireby/CorticalClock at 80c3df1, PredCorticalAge/Ref_DNAm_brain_values.rdat: the values the authors' CorticalClock.r adds for probes the data lacks. The repository has no licence file; the coefficients bundled for this clock come from the same implementation. Built by python/tools/build_references.py."
    preprocess: []
    postprocess:
      - {op: "add", value: 0.577682570446177}
      - {op: "anti_log_linear", adult_age: 20}

