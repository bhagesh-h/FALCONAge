    generation: "other"
    tissue: ["whole blood"]
    platform: ["EPICv1"]
    predicts: ["alcohol consumption"]
    training_target: ["alcohol consumption"]
    unit: ["units per week"]
    scale_type: "gestational_weeks"
    model_type: "LASSO regression"
    population: "adults"
    n_features: 450
    requires_fp64: false
    availability: "bundled"
    citation: "McCartney, D. L., et al. “Epigenetic prediction of complex traits and death.” Genome Biology 19, 136 (2018)."
    doi: "https://doi.org/10.1186/s13059-018-1514-1"
    notes: "Whole-blood DNAm LASSO score for alcohol consumption, trained in Generation Scotland on an age-, sex-, and ancestry-adjusted phenotype residual and evaluated out of sample in LBC1936."
    known_discrepancies:
      - "The paper defines this predictor as a weighted sum of beta values and
        applies no link function; the ROC analysis it reports dichotomises the
        phenotype, not the score. Packages that pass the sum through a sigmoid
        report a different number. The scale is relative_score, whose legal
        operations are correlate and rank, and a sigmoid is monotone, so no
        permitted result changes either way."
    coefficient_source:
      file: "coefficients/mccartneyalcohol.csv"
      sha256: "d8f768c1f7daf317f809b4ab04445b79ec3ee49f2d3fbb90a3d5a2838f846149"
      url: "https://doi.org/10.1186/s13059-018-1514-1"
      provenance: "McCartney et al. 2018, Genome Biology 19:136, Additional file 1, sheet 'Table S3 - Alcohol' (CC BY): 450 probes with LASSO weights, the predictor the paper evaluates. Probe ids are kept as published, including the ch. non-CpG probes."
      primary_source_traced: true
      redistributable: true
    reference_values:
      file: "references/blood_adult.csv.gz"
