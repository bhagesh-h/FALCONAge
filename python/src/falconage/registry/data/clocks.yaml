    platform: ["EPICv1"]
    predicts: ["basophil proportion"]
    training_target: ["cell-type proportions"]
    unit: ["proportion"]
    scale_type: "proportion"
    model_type: "reference-based constrained deconvolution"
    population: "adults"
    n_features: null
    requires_fp64: false
    availability: "B"
    citation: "Salas, L.A., Zhang, Z., Koestler, D.C. et al. Enhanced cell deconvolution of peripheral blood using DNA methylation for high-resolution immune profiling. Nature Communications 13, 761 (2022)."
    doi: "https://doi.org/10.1038/s41467-021-27864-7"
    notes: "Reference-based constrained deconvolution returning the basophil proportion from EPIC-array blood methylation. The published EPIC IDOL-Ext library used 1,200 CpGs selected to optimize recovery of known artificial-mixture cell-type proportions; pyaging instead inherits Biolearn’s undocumented 240-CpG replacement, whose rows reproducibly comprise 10 positive and 10 negative maximal cell-versus-other methylation contrasts per subtype and are not a subset of the published 1,200 probes."
