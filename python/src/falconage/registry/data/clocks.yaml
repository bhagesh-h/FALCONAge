  phenoage:
    name: "phenoage"
    year: 2018
    species: "Homo sapiens"
    data_type: "clinical_chemistry"
    generation: "second"
    tissue: ["blood"]
    platform: ["clinical laboratory assays"]
    predicts: ["phenotypic age"]
    training_target: ["mortality"]
    unit: ["years"]
    scale_type: "age_years"
    model_type: "clinical_formula"
    population: "adults"
    n_features: 10
    requires_fp64: false
    availability: "bundled"
    citation: "Levine, M. E., et al. \"An epigenetic biomarker of aging for lifespan and healthspan.\" Aging 10.4 (2018): 573-591."
    doi: "https://doi.org/10.18632/aging.101414"
    notes: "Clinical Phenotypic Age combines chronological age with nine blood biomarkers selected by penalized mortality regression and expresses mortality risk as an equivalent age in years. Closed form -- the ten coefficients and the Gompertz calibration are printed in the paper, so there is no coefficient file to fetch and nothing to trace."
    formula: "phenoage"
    requires_covariates: ["age"]
    known_discrepancies:
      - "Two constants circulate in the divisor of the Gompertz inversion: 0.090165, printed in
        Levine 2018 Supplement 1, and 0.09165, printed in Liu et al. 2018 (PLoS Med). FALCONAge
        uses 0.090165, the value BioAge corrected to in April 2026. Code still using 0.09165
        differs by several years on the same input."
      - "Levine 2018 Table 1 prints alkaline phosphatase as 0.0019; Liu et al. 2018 print 0.00188,
        and BioAge carries the fit at full precision (0.001868778, every weight rounding to Table
        1). FALCONAge uses Table 1 as printed, a mean 0.074 years above the full-precision fit on
        NHANES III; phenoage(df, coefficients='bioage') uses BioAge's."
      - "BioAge enters CRP as log(1 + CRP), its lncrp, where the paper uses log(CRP). On NHANES
        III that puts BioAge's phenoage0 a mean 1.50 years above the paper's formula (SD 0.45,
        more at low CRP; n = 8,924). FALCONAge follows the paper; phenoage(df,
        crp_transform='log1p', coefficients='bioage') reproduces phenoage0 exactly."
    coefficient_source:
      file: null
      url: null
      provenance: "Levine 2018, published closed form (coefficients printed in the paper)"
      primary_source_traced: true
      redistributable: true
    preprocess: []
    postprocess: []

