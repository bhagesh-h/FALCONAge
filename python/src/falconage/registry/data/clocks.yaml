# FALCONAge clock registry
# 
# GENERATED by registry/build.py from the catalogue metadata and the
# extracted coefficient sets. Edit the generator, not this file.
# 
# availability: what a user has to do before this clock will score.
#   bundled   coefficients ship inside the wheel, traced to a named source
#   untraced  catalogued, but no primary source for the numbers is established
#   licensed  architecture implemented; the coefficients are not ours to give
#
# Words rather than A, B and C. The letters carried their meaning in this
# legend and nowhere else, so every error message, plot label and table
# column that printed one had to re-explain it or leave the reader guessing.
---
schema_version: 1
registry_version: "1.1.0"
clocks:

  altumage:
    name: "altumage"
    year: 2022
    species: "Homo sapiens"
    data_type: "dna_methylation"
    generation: "first"
    tissue: ["multi-tissue"]
    platform: ["27K", "450K"]
    predicts: ["chronological age"]
    training_target: ["chronological age"]
    unit: ["years"]
    scale_type: "age_years"
    model_type: "deep neural network"
    population: "all ages"
    n_features: 20318
    requires_fp64: false
    availability: "bundled"
    citation: "de Lima Camillo, L.P., Lapierre, L.R. & Singh, R. A pan-tissue DNA-methylation epigenetic clock based on deep learning. npj Aging 8, 4 (2022)."
    doi: "https://doi.org/10.1038/s41514-022-00085-y"
    notes: "Pan-tissue chronological-age predictor using a five-hidden-layer neural network and 20,318 CpGs shared across the 27K, 450K and EPIC manifests; the actual training data came from 27K and 450K datasets."
    coefficient_source:
      file: "coefficients/altumage.safetensors"
      sha256: "8cac6130624bd6ae8b3f1a4d1d8be16d2a7784ba5378942318aaf303f5872e07"
      url: "https://github.com/rsinghlab/AltumAge"
      provenance: "de Lima Camillo et al., rsinghlab/AltumAge (MIT): the published Keras model, its RobustScaler and its CpG order, folded into one safetensors file by python/tools/build_altumage_weights.py. Batch norm and the scaler are affine at inference, so the fold is exact and is checked against the unfolded chain at build time."
      primary_source_traced: true
      redistributable: true
    reference_values:
      file: "references/altumage.csv.gz"
      sha256: "45e5bb0c379d2b5fef3cad86b02753d3bcb52f292ebf246166162b1ae478c89c"
      label: "AltumAge scaler centre (training median)"
      provenance: "rsinghlab/AltumAge at e34fd1b, example_dependencies/scaler.pkl (MIT), RobustScaler.center_: the training median per CpG, so a feature filled with it scales to 0. Built by python/tools/build_references.py."
    preprocess: []
    postprocess: []

  bohlin:
    name: "bohlin"
    year: 2016
    species: "Homo sapiens"
    data_type: "dna_methylation"
    generation: "other"
    tissue: ["cord blood"]
    tissue_policy: "refuse"   # cord blood; an adult blood clock has no calibration there, nor the reverse
    platform: ["450K"]
    predicts: ["gestational age"]
    training_target: ["gestational age"]
    unit: ["weeks"]
    scale_type: "gestational_weeks"
    model_type: "LASSO regression"
    population: "newborns"
    n_features: 96
    requires_fp64: false
    availability: "bundled"
    citation: "Bohlin, J., Håberg, S. E., Magnus, P. et al. Prediction of gestational age based on genome-wide differentially methylated regions. Genome Biology 17, 207 (2016)."
    doi: "https://doi.org/10.1186/s13059-016-1063-4"
    notes: "Gestational-age LASSO for cord blood, as the authors' predictGA package applies it by default: the one-standard-error model, 96 CpGs, fitted in days and returned here in weeks. The minimum-lambda model (251 CpGs) that biolearn, methylCIPHER and pyaging carry is the package's non-default option."
    known_discrepancies:
      - "The paper reports 96 CpGs; the coefficient set in circulation carries 251. Scores here
        will match other packages and not the figures printed in the paper."
    coefficient_source:
      file: "coefficients/bohlin.csv"
      sha256: "34bcd8d1911c6141b3cc89f37bd867e1632fb2f37c5f1679a3d57a0e976ef6fc"
      provenance: "Bohlin et al. 2016's own R package predictGA (github.com/JonBohlin/predictGA, commit 242801d, GPL (>= 2), as the paper's availability statement gives it): the cv.glmnet object UL.mod.cv at lambda.1se, which predictGA() uses by default ('model performance is comparable to minimum lambda, therefore it is default'): 96 CpGs and the intercept 272.68274063649744, in days. The 73 CpGs of the paper's Additional file 1 Table S3 (ultrasound model) are all among them. biolearn and methylCIPHER carry the lambda.min model instead (251 CpGs, intercept 277.2421)."
      primary_source_traced: true
      redistributable: true
    preprocess: []
    postprocess:
      - {op: "add", value: 272.68274063649744}
      - {op: "days_to_weeks"}

  cage:
    name: "cage"
    year: 2023
    species: "Homo sapiens"
    data_type: "dna_methylation"
    generation: "first"
    tissue: ["whole blood"]
    platform: ["450K", "EPICv1"]
    predicts: ["chronological age"]
    training_target: ["chronological age"]
    unit: ["years"]
    scale_type: "age_years"
    model_type: "elastic net regression with quadratic terms"
    population: "adults"
    n_features: 3225
    requires_fp64: false
    availability: "bundled"
    citation: "Bernabeu, E., McCartney, D.L., Gadd, D.A. et al. Refining epigenetic prediction of chronological and biological age. Genome Medicine 15, 12 (2023)."
    doi: "https://doi.org/10.1186/s13073-023-01161-y"
    notes: "cAge: two elastic nets on beta values and the squares of some of them, trained on 18,413 Generation Scotland blood samples (EPIC, restricted to the 374,791 CpGs shared with 450K) in a leave-one-cohort-out framework; one on age (2,274 linear and 56 quadratic terms) and one on log(age) (1,931 and 55), the second replacing the first when the first predicts 20 years or younger. 3,225 distinct CpGs."
    coefficient_source:
      file: "coefficients/cage.csv"
      sha256: "3062811536437687f7324844e62a963b23282551cd6740244a8c320aabf63419"
      provenance: "Bernabeu et al. 2023, Genome Medicine, Additional file 4 (CC BY 4.0), Table S8 (age model, column coefficient) and Table S9 (log-age model, column log_coefficient), extracted by python/tools/build_cage.py from the workbook pinned by SHA-256. Checked against the authors' repository elenabernabeu/cage_bage (commit 301f414, no licence file, so nothing is taken from it): the same 2,330 and 1,986 terms; S9 identical, S8 rounded to 9 decimals in the paper (at most 4.2e-9 from the repository)."
      primary_source_traced: true
      redistributable: true
    reference_values:
      file: "references/blood_adult.csv.gz"
      sha256: "d7b1eb99604c4365dae12b3c5a369d78dfa3217ffcf6ff17dbd65cea366965c6"
      label: "healthy adult whole blood (FALCONAge corpus)"
      provenance: "No per-CpG values are published for this clock (the authors' training means are in their repository only, which carries no licence). Mean beta over healthy adult (18 or older) whole blood, buffy coat and peripheral blood leukocytes in ComputAgeBench (CC BY-SA 4.0): GSE49909, GSE99624, GSE166611, GSE193836, GSE107143, GSE214297, GSE182991. CpGs measured on fewer than 20 samples are left out. Built by python/tools/build_references.py."
    preprocess: []
    postprocess: []

  cellpopage:
