[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "falconage"
dynamic = ["version"]
description = "Multiomic biological age and aging clock scoring, identical in Python and R"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Bhagesh Hunakunti", email = "bhunakun@uni-bonn.de" }]
keywords = ["aging", "epigenetic clock", "DNA methylation", "biological age", "geroscience"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# The base install is deliberately small. numpy carries the whole numerical
# core in FP64; torch is an extra, not a requirement, because a user scoring
# forty samples of blood chemistry should not download 800 MB of CUDA kernels
# to do it. The op implementations are written against an array-module handle
# (falconage.core.backend), so the same code runs on either.
#
# UPPER BOUNDS ARE DELIBERATE AND SO IS WHERE THEY SIT. The lock file pins
# pandas 2.3.3 and that is the only set CI used to exercise, but nobody installs
# the lock -- a `pip install` from the GitHub URL resolves whatever is current,
# which since January 2026 is pandas 3.0. So the shipped install path was the
# one path nothing tested.
#
# The suite was then run against pandas 3.0.5 / numpy 2.5.1 and passes, so the
# ceilings are set at the next major rather than at `<3`: capping below a
# version that demonstrably works would be a fiction. `python-test` now has a
# second job that resolves unpinned, so this claim keeps being checked instead
# of being a note written once.
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "scipy>=1.10,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
gpu = ["torch>=2.0"]
methylation = ["pyarrow>=14.0"]     # parquet betas
plot = ["matplotlib>=3.7"]
anndata = ["anndata>=0.10", "h5py>=3.8"]
cli = ["typer>=0.12"]
all = ["falconage[gpu,methylation,plot,anndata,cli]"]
dev = [
  "falconage[methylation,plot,anndata,cli]",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
]

[project.scripts]
falconage = "falconage.cli.app:main"

[project.urls]
Homepage = "https://github.com/bhagesh-h/FALCONAge"
Documentation = "https://bhagesh-h.github.io/FALCONAge/"
Source = "https://github.com/bhagesh-h/FALCONAge"
Issues = "https://github.com/bhagesh-h/FALCONAge/issues"

[tool.hatch.version]
path = "src/falconage/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/falconage"]

# The registry travels inside the wheel. A clock catalogue that has to be
# downloaded is a catalogue that is unavailable offline and different between
# two machines, which is the opposite of what registry_version is for.
#
# No force-include is needed, and adding one breaks the build: `packages` above
# already carries every file under src/falconage that is not VCS-ignored,
# registry/data/clocks.yaml included, and hatchling refuses to write the same
# archive path twice. The failure only appears when a real wheel is built --
# an editable install never runs the wheel builder -- so it stayed hidden until
# the Docker image tried it.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "network: needs internet access",
  "corpus: needs the test corpus in test/data (see test/data/README.md)",
  "slow: takes more than a second",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# WHY THE SELECTION IS THIS SMALL.
#
# `["E", "F", "W", "I", "UP", "B", "SIM"]` produced 66 findings and wanted 24
# files reformatted, none of which was a bug. Most were stylistic preferences
# this codebase has deliberately made differently -- explicit loops that read
# better than the comprehension SIM suggests, `zip()` without strict= where the
# lengths are established two lines above.
#
# A lint gate is worth having only if a red badge means "you broke something".
# One that a single maintainer has to argue with weekly gets disabled, and then
# the rules that DO catch bugs go with it. So: pyflakes, which finds unused
# imports, unused locals, undefined names and f-strings missing their
# placeholders, plus E9 for syntax and IO errors that stop ruff parsing at all.
# Those found eight real pieces of cruft on their first run, including six
# functions binding a handle they never used.
#
# `ruff format` is deliberately not run in CI either. Formatting is an opinion,
# this codebase has one, and reformatting 24 files to satisfy a tool would bury
# the comments that explain why the code is shaped the way it is.
select = ["F", "E9"]

[tool.ruff.format]
# Available for anyone who wants it locally; not a gate.
docstring-code-format = false
