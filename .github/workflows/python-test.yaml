# The Python core: tests, lint, and the generated-file staleness check, in one
# job.
#
# WHY ONE JOB AND ONE PYTHON VERSION. This is maintained by one person, and a
# pipeline is only useful if a red badge means "you broke something" rather than
# "the matrix is being the matrix again".
#
# The version tested is the version the lock file resolves and both Docker
# images run, which is the only combination anything ships on. A matrix over
# 3.10 and 3.13 tested the dependency resolver rather than this package: the
# lock pins one set, `uv export --frozen` reproduces it, and on any other
# interpreter the pinned wheels either do not exist or do not match, so the job
# fails before reaching a test. Three red badges where one would do teaches
# people to ignore the badge.
#
# `requires-python` still declares >= 3.10. Nothing here narrows what the
# package claims, only what is verified; broadening that is real work -- an
# unpinned resolution per version and a policy for moving floors -- and belongs
# in its own change.
#
# There is no GPU job. GitHub's hosted runners have no CUDA device, so a GPU job
# could only ever assert that torch reports no GPU, which is not a test of
# anything. `test/gpu_check.py` is run by hand against real hardware and its
# output is in docs/gpu.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: python-test

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The same locked set, and the same named extras, that both Docker images
      # install. Resolving freshly here would leave the images tested by
      # nothing, and a green CI on a dependency set nobody ships is the specific
      # kind of green that costs an afternoon later.
      #
      # A temporary file rather than `<(...)`: process substitution is a bash
      # feature, and a step that silently depends on the runner's default shell
      # breaks the day somebody sets `shell: sh`.
      - name: Install
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes \
            --extra methylation --extra plot --extra anndata --extra cli \
            --directory python --format requirements-txt > /tmp/requirements.txt
          uv pip install --system -r /tmp/requirements.txt
          uv pip install --system --no-deps ./python
          uv pip install --system pytest

      # No coverage report. It printed 60 lines of site-packages paths on every
      # run and nobody read them; `pytest --cov` locally is there when a
      # coverage question is actually being asked.
      #
      # The corpus tests skip here -- 586 MB of GEO payloads are not worth
      # fetching per push -- so this is the unit and property suite. The corpus
      # is exercised by test/run_all.py before a release.
      - name: Test
        run: pytest python/tests -q

      # The registry is data, and data has to load before anything that reads it
      # is worth testing.
      - name: The clock registry loads
        run: |
          python -c "import falconage as fa; r = fa.registry.load(); \
            print(len(list(r)), 'clocks, schema', r.version)"

      # Four generated files: both documentation configs, r/NEWS.md from
      # CHANGELOG.md, and the clock catalogue from the registry. Editing any of
      # them by hand looks fine until the next build reverts it; a NEWS file
      # that has drifted from the changelog is the one users read; and a stale
      # catalogue describes a registry the package does not ship.
      #
      # build_docs.py --check also fails when an exported R topic belongs to no
      # reference group, which is what pkgdown refuses to build over. Catching
      # it in this job takes a second; catching it in the docs job takes two
      # minutes and happens after the site has already been half built.
      - name: Generated files are current
        run: |
          uv pip install --system pyyaml
          python docs/build_docs.py --check
          python docs/build_news.py --check
          python docs/build_catalogue.py --check
          python docs/build_gallery.py --check
          python docs/build_contents.py --check

      # The three derived data artefacts. Each needs an input CI does not have
      # -- a 72 MB published spreadsheet for the reliability table, the 586 MB
      # corpus for the other two -- so they cannot be regenerated here. What CAN
      # be checked without either is that the shipped files parse, cover the
      # clocks they claim to, and carry the provenance the manifest records.
      # A stale artefact is caught by the local --check before it is committed;
      # this catches a corrupt or truncated one.
      - name: Derived registry artefacts load
        run: |
          python - <<'PY'
          import falconage as fa
          from falconage.preprocess import _load_platform_bias

          icc = fa.uncertainty.load_probe_icc()
          assert len(icc) > 250_000, len(icc)
          src = fa.uncertainty.probe_icc_source()
          assert src["licence"] == "CC BY 4.0" and len(src["sha256"]) == 64
          print(f"probe_icc: {len(icc)} probes, {src['sha256'][:12]}")

          bias = _load_platform_bias()
          assert {"EPICv1", "EPICv2"} <= {p for _, p in bias}
          print(f"platform_bias: {len(bias)} clock x platform rows")

          cal = fa.uncertainty.load_conformal()
          assert not cal.empty
          # Only the shipped rows; the banded rows are diagnostics at n >= 20.
          allrows = cal[cal["age_band"] == "all"]
          assert allrows["n_calibration"].min() >= 40, allrows["n_calibration"].min()
          print(f"conformal: {cal['clock'].nunique()} clocks")

          ev = fa.registry.evidence()
          assert (ev["doi"].str.len() > 0).all(), "an evidence row without a DOI"
          print(f"evidence: {len(ev)} rows, all with a DOI")
          PY

      # Prose is not executed, so a function name in a fenced code block is
      # just text and stays wrong forever. The README's quick start told people
      # to call fa.report(), fa.cox(), fa.probe(), fa.preprocess_methylation()
      # and fa.preprocess_clinical() -- none of which existed. The first
      # example on the landing page raised AttributeError on its last line and
      # every test in this suite passed anyway.
      - name: Documented API exists
        run: python docs/check_api_docs.py

      # The other half of the same problem. check_api_docs.py catches a name
      # that does not exist; this catches a feature that does exist and is not
      # documented, or is documented as belonging to the previous release.
      #
      # Seven such defects were reported at once against v1.1.0: the landing
      # page named none of the new inputs, the catalogue linked no papers, the
      # architecture page still called itself v1.0, output was pasted into
      # copyable command fences, the routing table did not cover every clock,
      # the availability column spent half the page on one letter, and the
      # parity table claimed Python lacked functions it had. Three of those
      # pages are machine-generated, so a generator change can undo a hand fix
      # without anyone touching the page.
      - name: Documentation describes this release
        run: python docs/check_docs_complete.py

      # Punctuation, not content. Four hundred em dashes accumulated across
      # these pages, each one standing in for a colon, a comma, a full stop or
      # a pair of parentheses, plus eighteen horizontal rules between sections
      # that already had headings. Individually defensible, collectively the
      # reason a scientific catalogue read as generated filler. The habit is
      # invisible to the person who has it, so it is counted rather than
      # reviewed.
      - name: Prose reads as written, not as generated
        run: python docs/check_prose.py

      # Neither image built for an unknown stretch. Both pinned uv==0.5.18
      # while uv.lock moved to revision 3, which that uv refuses to parse, so
      # the dependency layer died six minutes into a build whose command is the
      # first instruction in README.md. Nothing noticed, because no workflow
      # builds an image and the images on the maintainer's machine had been
      # built when the lock was older.
      #
      # Building here to catch it would cost ten minutes a push. Comparing the
      # pin against a measured floor costs a second and catches the same thing.
      - name: The Docker images can read the lock they install from
        run: python test/check_docker_lock.py

      # On every push, not only on a tag. The release workflow checks this too,
      # but a check that only runs at release time is a check that tells you
      # about the problem at the worst possible moment -- which is exactly what
      # happened with v1.0.0. Here it fails on the commit that introduced the
      # drift, while the fix is still cheap.
      - name: Versions agree
        run: python test/check_versions.py

      # The rule selection lives in python/pyproject.toml, with the reasoning.
      # Short version: pyflakes and syntax errors only. A style gate a single
      # maintainer argues with weekly gets disabled, and the rules that catch
      # real bugs go with it.
      - name: Lint
        run: uvx ruff check --config python/pyproject.toml python/src python/tests test docs

  # WHY A SECOND JOB WHEN THE WHOLE POINT ABOVE WAS TO HAVE ONE. Because the two
  # answer different questions, and the first one does not answer this one.
  #
  # `test` installs the lock: pandas 2.3.3, the set both Docker images ship. But
  # the README tells people to `pip install` from a GitHub URL, which resolves
  # fresh -- pandas 3.0 since January 2026, with copy-on-write mandatory and the
  # object string dtype gone. That is the install almost every user gets, and
  # until this job existed it was tested by nothing at all.
  #
  # `continue-on-error` on purpose. A new pandas or numpy release breaking this
  # is news worth having, but it is not the contributor's fault and it must not
  # block their pull request. Red here means "go and look"; red above means
  # "you broke it".
  latest-deps:
    name: unpinned resolution (what a fresh install gets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install with no lock
        run: |
          python -m pip install --upgrade pip
          pip install "./python[methylation,plot,anndata,cli]" pytest

      - name: What resolved
        run: pip list | grep -Ei "^(numpy|pandas|scipy|pyarrow|matplotlib) "

      - name: Test
        run: pytest python/tests -q
