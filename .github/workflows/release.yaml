# Distribution.
#
# Neither package is on a registry yet, so a tagged release IS the distribution
# channel: this workflow produces the artefacts both `pip install` and
# `install_github` resolve against, checks them the way the registries would,
# and attaches them to the release so a specific version can be installed by URL
# and archived alongside a paper.
#
# The routes, in the order they become available:
#
#   1. GitHub, today. `pip install "falconage @ git+...@v1.0.0#subdirectory=python"`
#      and `remotes::install_github("bhagesh-h/FALCONAge@v1.0.0", subdir = "r")`
#      both work against a tag with no registry involved.
#   2. r-universe -- no gatekeeper, one packages.json in a <user>.r-universe.dev
#      repository, and R users get install.packages() with binaries for Windows,
#      macOS and Linux. Nothing in this workflow is needed for it, which is why
#      it is documented in PUBLISHING.md rather than automated here.
#   3. PyPI and CRAN or Bioconductor. PyPI needs a trusted-publisher claim
#      configured on the project before the job below can be enabled; CRAN and
#      Bioconductor are human-reviewed submissions that cannot be automated.
#      This workflow builds what each wants and runs the checks each gates on,
#      so a submission is a matter of uploading what it already produced.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

name: release

permissions:
  contents: write

jobs:
  # ---- Python -----------------------------------------------------------------
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # The tag, the wheel, DESCRIPTION and CITATION.cff must all agree, or a
      # release installs as a different version than its name -- unfixable
      # afterwards, because the tag is what a citation points at.
      #
      # This used to be three inline scripts in two languages, and the Python
      # one read `[project].version` from pyproject.toml. That key does not
      # exist: the version is `dynamic` and hatchling reads it from
      # `src/falconage/_version.py`. Because the step was gated on a tag ref it
      # had never once run, so it was wrong from the day it was written and
      # only surfaced when v1.0.0 was pushed -- KeyError on the first step of
      # the release. One script now, and it runs locally, which is what would
      # have caught it.
      - name: Versions agree
        run: python test/check_versions.py --tag "${{ github.ref }}"

      - run: pip install build twine
      - run: python -m build python/
      - run: twine check python/dist/*

      - uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: python/dist/*
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: python/dist/*
          generate_release_notes: true

  # ---- R -----------------------------------------------------------------------
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_FORCE_SUGGESTS_: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the Python core
        run: |
          pip install ./python[plot,anndata]
          echo "RETICULATE_PYTHON=$(which python)" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check

      # Same one check as the Python job. Both run it because either job can be
      # the one that fails, and a mismatch found before R CMD check saves
      # forty minutes.
      - name: Versions agree
        run: python test/check_versions.py --tag "${{ github.ref }}"

      - name: Build the source tarball
        run: R CMD build r

      - name: Check as CRAN
        run: |
          tarball <- list.files(pattern = "[.]tar[.]gz$")[1]
          res <- rcmdcheck::rcmdcheck(tarball, args = c("--no-manual", "--as-cran"),
                                      error_on = "warning")
          print(res)
        shell: Rscript {0}

      - uses: actions/upload-artifact@v6
        with:
          name: r-tarball
          path: '*.tar.gz'
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: '*.tar.gz'
          generate_release_notes: true
