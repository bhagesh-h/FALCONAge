# =============================================================================
# FALCONAge - compose definitions
# =============================================================================
#
# Run from the repository root so the relative paths resolve:
#
#   docker compose -f docker/docker-compose.yml run --rm falconage run /work/betas.csv
#   docker compose -f docker/docker-compose.yml run --rm testdata plan
#
# `falconage` names the published image and also carries a `build:`, so
# `docker compose pull` fetches it and `docker compose build` reproduces it.
# -----------------------------------------------------------------------------

name: falconage

services:

  falconage:
    image: bhagesh/falconage:1.0.0-cpu
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    volumes:
      - ..:/work
      - falconage-cache:/opt/falconage/cache
    environment:
      OMP_NUM_THREADS: 8

  # The same image with a checkout mounted over it: edit on the host, run in
  # the container, no rebuild. See docker/entrypoint.sh.
  falconage-dev:
    image: bhagesh/falconage:1.0.0-cpu
    volumes:
      - ..:/src:ro
      - ..:/work
      - falconage-cache:/opt/falconage/cache
    environment:
      FALCONAGE_SOURCE: /src
      FALCONAGE_VERBOSE: debug

  # Fetches the public test corpus into test/data/.
  testdata:
    image: falconage-testdata:1.0.0
    build:
      context: ..
      dockerfile: docker/Dockerfile.testdata
    volumes:
      - ../test/data:/data
    environment:
      FALCONAGE_TESTDATA_OUT: /data

volumes:
  falconage-cache:
